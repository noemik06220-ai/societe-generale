<title>Nova Démo — Banque fictive</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}
header {
  background: #102b50;
  color: white;
  padding: 24px 18px;
}
header h1 { margin: 0; }
header p { margin-bottom: 0; }
main { padding: 18px; max-width: 600px; margin: auto; }
.demo {
  background: #fff3cd;
  color: #725400;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
}
.balance {
  background: #1557a0;
  color: white;
  padding: 24px;
  border-radius: 16px;
  margin: 18px 0;
}
.amount { font-size: 32px; font-weight: bold; }
.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin: 14px 0;
  box-shadow: 0 2px 8px #0000000c;
}
.transaction {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #e5e7eb;
}
form { display: grid; gap: 12px; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  font-size: 16px;
}
input { border: 1px solid #cbd5e1; }
button {
  background: #1557a0;
  color: white;
  border: 0;
  font-weight: bold;
}
footer { text-align: center; padding: 24px; color: #64748b; }
