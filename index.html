
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "TON_API_URL";
  const SUPABASE_KEY = "TA_CLE_PUBLISHABLE";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("loyaltyForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = document.getElementById("message");
      const bouton = this.querySelector('button[type="submit"]');

      const donnees = {
        nom: document.getElementById("nom").value.trim(),
        prenom: document.getElementById("prenom").value.trim(),
        numero_demo: document.getElementById("carte").value.trim()
      };

      if (!/^DEMO-[0-9]{6}$/.test(donnees.numero_demo)) {
        message.textContent =
          "Utilise un numéro de test comme DEMO-123456.";
        return;
      }

      bouton.disabled = true;
      message.textContent = "Enregistrement en cours…";

      try {
        const { error } = await client
          .from("demo_loyalty_cards")
          .insert([donnees]);

        if (error) throw error;

        message.textContent =
          "Enregistrement de démonstration réussi !";
        this.reset();
      } catch (error) {
        console.error(error);
        message.textContent =
          "Erreur : vérifie l’URL, la clé publique et les autorisations de la table.";
      } finally {
        bouton.disabled = false;
      }
    });
</script>
