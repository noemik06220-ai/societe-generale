
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de fidélité — Démo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #292929;
    }

    header {
      background: #d71920;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
    }

    .demo-banner {
      background: #fff0f0;
      color: #a51017;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    main {
      max-width: 520px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }

    h2 {
      color: #d71920;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #d71920;
      border-color: #d71920;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #d71920;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ad1017;
    }

    #message {
      margin-top: 18px;
      color: #23733a;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Fidélité Démo</h1>
    <p>Espace de démonstration</p>
  </header>

  <div class="demo-banner">
    SITE FICTIF — AUCUNE AFFILIATION À UNE BANQUE OU UNE ENSEIGNE
  </div>

  <main>
    <h2>Ma carte bleu </h2>
    <p>Teste le formulaire avec des données .</p>

    <form id="loyaltyForm">
      <label for="nom">Nom</label>
      <input id="nom" name="nom" autocomplete="off"
             placeholder="Ex. Martin" required>

      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" autocomplete="off"
             placeholder="Ex. Camille" required>

      <label for="adresse">Adresse postale </label>
      <input id="adresse" name="adresse" autocomplete="off"
             placeholder="Ex. 10 rue de la tours" required>

      <label for="carte">Numéro de carte </label>
      <input id="carte" name="carte" autocomplete="off"
             placeholder="DEMO-123456" pattern="DEMO-[0-9]{6}"
             title="Utilise le format DEMO-123456" required>

      <label for="expiration">Date d’expiration </label>
      <input id="expiration" name="expiration" type="month" required>

      <button type="submit">Tester le formulaire</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <footer>
    Démonstration uniquement · Les données ne sont ni enregistrées ni envoyées.
  </footer>

  <script>
    document.getElementById("loyaltyForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Test réussi ! Aucune donnée n’a été enregistrée.";
      this.reset();
    });
  </script>
</body>
</html>
